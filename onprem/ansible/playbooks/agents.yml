- name: Install Grafana Alloy agent on all Linux nodes (except the collector)
  hosts: "linux:!monitoring"
  become: true
  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name: [gpg, ca-certificates, curl]
        update_cache: true

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Grafana GPG key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: "0644"

    - name: Add Grafana apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
        filename: grafana
        state: present

    - name: Install Alloy
      ansible.builtin.apt:
        name: alloy
        state: present
        update_cache: true

    - name: Let Alloy read the systemd journal
      ansible.builtin.user:
        name: alloy
        groups: [adm, systemd-journal]
        append: true
      notify: Restart alloy

    - name: Deploy agent config
      ansible.builtin.template:
        src: agent.alloy.j2
        dest: /etc/alloy/config.alloy
        owner: root
        group: alloy
        mode: "0640"
        validate: "alloy fmt %s"
      notify: Restart alloy

    - name: Enable and start Alloy
      ansible.builtin.systemd:
        name: alloy
        enabled: true
        state: started

  handlers:
    - name: Restart alloy
      ansible.builtin.systemd:
        name: alloy
        state: restarted